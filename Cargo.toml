[workspace]
members = ["crates/ligase-core", "crates/ligase-py"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Kelyn Njeri <kelyn.njeri@gmail.com>"]
repository = "https://github.com/Neoforge-Labs/ligase"
keywords = ["bioinformatics", "pipeline", "reproducibility", "genomics"]
categories = ["science"]

[workspace.dependencies]
ligase = { path = "crates/ligase-core", version = "0.1.0" }
pyo3 = "0.30"

# Format I/O. noodles is pure Rust, so wheels build without a C htslib --
# which keeps `pip install ligase-bio` working everywhere. It is a 0.x crate
# and bumps minor versions often, so expect periodic upgrade churn; its MSRV
# is what sets ours.
noodles = { version = "0.118", default-features = false }
# MD5 is not a security choice here: it is what the SAM specification
# prescribes for the @SQ M5 contig checksum.
md-5 = "0.11"
# Plain gzip (.fastq.gz); BGZF is handled by noodles.
flate2 = "1.1"
tempfile = "3.27"

# Cache keys and content addressing (D2, D3). The `mmap` and `rayon`
# features are what make hashing a multi-gigabyte BAM cheap enough to do on
# every run, which is what lets the cache trust content rather than
# timestamps.
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
# Cache metadata (D6). `bundled` compiles SQLite from source: it costs a C
# compiler at build time and buys one identical SQLite everywhere, which a
# persistent on-disk format needs.
rusqlite = { version = "0.40", features = ["bundled"] }
# The executor's worker pool. Steps are external processes, so the DAG is
# run by Rust threads and never touches the GIL.
rayon = "1.12"

# Fetching a remote input (D39). Blocking, because the executor is a rayon
# thread pool and deliberately never touches an async runtime -- and because
# a fetch here is one synchronous call whose answer the caller needs before
# it can do anything else.
#
# Chosen over `reqwest`, which the feature spec named, for the install story
# that D11 is about: `reqwest`'s `rustls` feature resolves to `aws-lc-rs`,
# which needs `cmake` at build time, and a wheel that needs cmake does not
# build on a machine without it. `ureq` uses rustls over `ring`, which needs
# only a C compiler -- and `rusqlite`'s bundled SQLite already requires one,
# so this adds no toolchain requirement at all. It also costs 16 crates
# against 82, because it needs no tokio, no hyper and no tower to make a
# blocking GET.
ureq = { version = "3.5", default-features = false, features = [
  "rustls",
  "gzip",
] }

# Canonicalising a recorded response body (D39). The engine needs no JSON
# anywhere else -- its one structured store is SQLite (D6) and a bundle is
# flat TSV -- but a record's body has to be canonicalised before it is
# hashed, and "two responses meaning the same thing hash the same" is a
# claim about JSON structure rather than about bytes.
#
# It costs two crates: `serde`, `itoa` and `memchr` are already in the tree,
# so only `serde_json` and `ryu` are new. Pure Rust, no build tool, so
# nothing here touches the install story D11 is about.
#
# `arbitrary_precision` keeps every number as the text the server sent
# rather than round-tripping it through an f64. A canonicaliser must never
# silently change a number: without it a twenty-digit accession in a
# response body would be rounded on its way into the store, and the stored
# body would differ from the answer in a way nothing reports. Key sorting
# needs no feature at all -- with `preserve_order` off, a map is a
# `BTreeMap` and re-serialising sorts.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# Encodes the CLAUDE.md rule "no unwrap outside tests" as a machine check.
# Test files opt out explicitly with #![allow(...)].
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
