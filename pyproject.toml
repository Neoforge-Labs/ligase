[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "ligase-bio"
description = "Type-safe, reproducible computational biology pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Kelyn Njeri", email = "kelyn.njeri@gmail.com" }]
keywords = ["bioinformatics", "pipeline", "reproducibility", "genomics", "provenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.scripts]
# `ligase check` imports a pipeline file and type-checks it. It lives in
# Python rather than in the Rust core because it has to import the user's
# pipeline module -- which is how a Python pipeline declares itself.
ligase = "ligase.cli:main"

[project.urls]
Repository = "https://github.com/Neoforge-Labs/ligase"
Changelog = "https://github.com/Neoforge-Labs/ligase/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "maturin>=1.15,<2.0",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]
# The remote store tier (D43). This extra adds no Python package, because
# there is none to add: the backend is Rust, behind the `remote-store`
# cargo feature, and **a Python extra cannot reach a cargo feature**. A
# published wheel is compiled one way or the other, so asking for the
# extra alone does not change the wheel you already have.
#
# What it is for is to be the documented name of the thing, and the place
# this note lives. To get a build with the tier in it:
#
#   MATURIN_PEP517_ARGS="--features remote-store" \
#     pip install --no-binary ligase-bio "ligase-bio[remote-store]"
#
# `ligase store status` says which build you have, so the question is
# answerable on the installation in front of you rather than from the
# release notes. The alternative -- compiling it into every published
# wheel -- was rejected: `object_store`'s AWS stack needs cmake at build
# time, and the default install must not (D6, D11).
remote-store = []
# The chemistry kinds (D49). Unlike `remote-store` above, this extra is not
# empty, and the difference is the point: RDKit is a Python package, so an
# extra can reach it.
#
# The engine core knows no chemistry. It compares `representation` values
# and refuses to connect two molecule sets that disagree, which needs no
# toolkit -- so loading a molecule table, checking it and hashing it all
# work on a default install. What needs RDKit is *producing* a set whose
# standardisation is known, which is `lg.chem.standardize` and nothing else.
# `ligase.chem` imports RDKit inside the function that uses it, so
# `import ligase` on a genomics install imports no chemistry, and
# `tests/test_default_install.py` is what notices the day that stops being
# true.
#
# The floor is measured rather than guessed. InChIKeys were identical
# across 2022.09.5, 2023.09.6, 2024.09.6, 2025.09.6, 2026.03.6 and
# 2026.09.1 for thirty molecules in six standardisation states, so any of
# those would do on the chemistry. 2024.3 is the floor because it is the
# first series with NumPy 2 wheels: the two series below it need
# `numpy<2` pinned, and an extra has no way to say so.
chem = [
  "rdkit>=2024.3.1",
]
docs = [
  # marimo authors and runs the example notebooks. Their pages are generated
  # from real runs rather than embedded as browser-executed islands, because
  # ligase is a native extension and there is no emscripten wheel for it.
  "marimo>=0.25",
]

# This is the whole Python side of the docs. The site itself is Nextra, in
# web/, and needs Node rather than Python packages: `npm ci` there installs
# it. Its generators -- the API reference, the CLI reference, the captured
# diagnostics, the quickstart and the rendered notebooks -- import `ligase`
# itself and use nothing else, so a docs build still needs the Rust toolchain
# and a C compiler to build the extension, exactly as the mkdocstrings build
# it replaced did.

[tool.maturin]
manifest-path = "crates/ligase-py/Cargo.toml"
module-name = "ligase._core"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
# Both are this project's own code; `src` cannot say so for `tests`, whose
# modules are imported as `tests.*` rather than from inside the directory.
known-first-party = ["ligase", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test function names describe the behaviour; a docstring would just repeat it.
"tests/*" = ["D103"]
# marimo writes every cell as `def _(dep):` -- no annotations, no docstring,
# and the name is always `_`. That is the notebook file format, not code a
# person wrote, so the rules that police signatures do not apply. Everything
# else, including the import and correctness rules, still does.
# B018 is marimo's cell-output idiom: a cell's trailing bare expression
# is what the cell displays, which ruff reads as a useless expression.
"examples/notebooks/*" = ["ANN", "B018", "D103"]
# RDKit ships no type information, so a molecule object has no type to
# name. `Any` is the honest annotation for one -- the alternative is a
# hand-written protocol that would claim to know an API nobody published --
# and these are the only two files in the project that hold one.
"python/ligase/chem.py" = ["ANN401"]
"scripts/measure_inchikey_stability.py" = ["ANN401"]
# The docs site's generators introspect the package at runtime: they are
# handed the `ligase` module object, arbitrary exported objects and whatever
# a notebook cell returned. `Any` is the honest annotation for all three --
# the whole point of the code is that it does not know the type in advance.
"web/scripts/*" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
# `examples/` is checked too: a pipeline shown to users of a typed framework
# should be one a type checker accepts, and this is what notices when it
# stops being. `web/scripts/` generates the docs site from the package's own
# docstrings, so it is the thing most likely to break on an API change and
# the least likely to be exercised by a test.
files = ["python", "tests", "examples", "web/scripts"]
# marimo cells receive their dependencies as untyped parameters, so inside a
# cell `lg` is a parameter and `lg.Reference` cannot resolve as an annotation.
# These are checked by being executed on every docs build, which is a stronger
# guarantee than annotation for an example anyway.
exclude = ["^examples/notebooks/"]
mypy_path = "python"
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# RDKit is an optional extra, so the *same* check has to pass whether or not
# it is installed -- and it is not installed on the python matrix, which
# mirrors a default install on purpose.
#
# Absent, `import rdkit` is an unresolvable import. Present, mypy reads its
# sources, finds no type information worth having, and objects to each call
# into it. So the two calls below are both needed, and together they make the
# check say the same thing in both environments. A check whose result depends
# on an optional dependency is a check nobody can act on -- which is how this
# passed locally and failed on CI.
[[tool.mypy.overrides]]
# Both patterns: `rdkit.*` does not match `rdkit` itself, and
# `from rdkit import Chem` reads an attribute of the bare module.
module = ["rdkit", "rdkit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The two files that hold a molecule. Their `type: ignore` comments are
# needed where RDKit is installed and inert where it is not, so an unused
# one here is a fact about the machine rather than about the code. Narrowed
# to these two files so that an ignore gone stale anywhere else still fails.
module = ["ligase.chem", "tests.test_inchikey_stability"]
warn_unused_ignores = false
