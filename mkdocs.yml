site_name: Ligase
site_description: Type-safe, reproducible computational biology pipelines
site_url: https://neoforge-labs.github.io/ligase/
repo_url: https://github.com/Neoforge-Labs/ligase
repo_name: Neoforge-Labs/ligase
edit_uri: edit/main/docs/
site_author: Kelyn Paul Njeri
copyright: Copyright &copy; 2026 Kelyn Paul Njeri, NeoForge Labs

theme:
  name: material
  icon:
    logo: material/dna
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Concepts:
      - Project layout: concepts/project-layout.md
      - Types and dimensions: concepts/types-and-dimensions.md
      - Pipelines and the graph: concepts/pipelines.md
      - Running, and not running: concepts/caching.md
      - What a file means: concepts/semantic-hashing.md
      - How was this produced?: concepts/provenance.md
      - When a tool names a sample after a file: concepts/notes.md
      - Resistance interpretation: concepts/resistance-interpretation.md
      - Validation: concepts/validation.md
  - Guide:
      - Installation: guide/installation.md
      - Example notebooks: guide/notebooks.md
      - Declaring dimensions: guide/declaring-dimensions.md
      - Building a pipeline: guide/building-a-pipeline.md
      - Running a pipeline: guide/running-a-pipeline.md
      - Semantic hashing and auditing: guide/semantic-hashing.md
      - Writing up a pipeline: guide/provenance.md
      - Reading what the engine noticed: guide/notes.md
      - Interpreting resistance: guide/resistance-interpretation.md
      - Releasing: guide/releasing.md
  - Architecture:
      - Workspace: architecture/workspace.md
      - Type system: architecture/type-system.md
      - Graph: architecture/graph.md
      - Execution: architecture/execution.md
      - Cache: architecture/cache.md
      - Canonicalisation: architecture/canonicalisation.md
      - Provenance: architecture/provenance.md
      - Resistance interpretation: architecture/hivdb.md
  - Design:
      - Golden example: golden-example.md
      - Dimensions: dimensions.md
      - Milestones: milestones.md
      - Decisions: decisions.md
  - API reference: api.md
  - Licence: licence.md
