site_name: Ligase
site_description: Type-safe, reproducible computational biology pipelines
site_url: https://neoforge-labs.github.io/ligase/
repo_url: https://github.com/Neoforge-Labs/ligase
repo_name: Neoforge-Labs/ligase
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/dna
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Concepts:
      - Project layout: concepts/project-layout.md
  - Guide:
      - Installation: guide/installation.md
  - Architecture:
      - Workspace: architecture/workspace.md
  - Design:
      - Golden example: golden-example.md
      - Dimensions: dimensions.md
      - Milestones: milestones.md
      - Decisions: decisions.md
