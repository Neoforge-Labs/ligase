[package]
name = "ligase-py"
description = "Python bindings for the Ligase core engine"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Imported from Python as `ligase._core`; the public surface lives in
# python/ligase/__init__.py.
name = "_core"
crate-type = ["cdylib"]

[features]
# Forwarded so that the wheel can be built with the remote tier in it:
#   MATURIN_PEP517_ARGS="--features remote-store" pip install -e .
# A Python extra cannot reach a cargo feature, so this is how
# `ligase-bio[remote-store]` is actually obtained. The extra itself is a
# marker and a place to hang the documentation.
remote-store = ["ligase/remote-store"]

[dependencies]
ligase = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }

[lints]
workspace = true
