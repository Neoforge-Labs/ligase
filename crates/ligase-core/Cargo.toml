[package]
name = "ligase"
description = "Type-safe, reproducible computational biology pipelines (core engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
flate2 = { workspace = true }
md-5 = { workspace = true }
# No "fasta": FASTA is scanned by hand so a three-gigabase reference can be
# checksummed without being held in memory.
noodles = { workspace = true, features = [
  "bam",
  "bgzf",
  "fastq",
  "sam",
  "vcf",
] }
rayon = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# A fetched `.fastq.gz` has to be really gzipped for the remote tests to
# exercise the same path the demo does; already in the tree, so this costs
# nothing new.
flate2 = { workspace = true }
# The tests that pin the scheduler's behaviour queue work on the pool a
# step is running on, which is what hashing inside a step does (D27).
rayon = { workspace = true }
tempfile = { workspace = true }
