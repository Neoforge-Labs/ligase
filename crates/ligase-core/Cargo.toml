[package]
name = "ligase"
description = "Type-safe, reproducible computational biology pipelines (core engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
flate2 = { workspace = true }
md-5 = { workspace = true }
# No "fasta": FASTA is scanned by hand so a three-gigabase reference can be
# checksummed without being held in memory.
noodles = { workspace = true, features = [
  "bam",
  "bgzf",
  "fastq",
  "sam",
  "vcf",
] }
rayon = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
