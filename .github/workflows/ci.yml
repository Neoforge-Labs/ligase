name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The Ubuntu runner is pinned rather than tracking ubuntu-latest, which
# migrates to Ubuntu 26 from 19 October 2026. A runner image change can
# alter preinstalled tooling -- shellcheck, for one, which the shell job
# relies on being present -- so the image moves when we choose, not on
# GitHub's schedule.
jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        # -D warnings also promotes the workspace `missing_docs` lint to an
        # error, so public items without docs fail CI.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pip install -e .
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: pytest
        run: pytest
      - name: import ligase
        run: python -c "import ligase; print(ligase.__version__)"

  # The chemistry extra, which the matrix above deliberately does not
  # install. That job mirrors a default install -- it is what proves the
  # genomics install acquires no toolkit -- so with RDKit absent every
  # chemistry test there skips, by design.
  #
  # Skipping everywhere would mean the standardiser ran on nobody's machine
  # but the author's. So this job installs the extra and runs exactly the
  # tests that need it: the conversion, the asymmetric stereo check, the
  # failures it names, and the measurement the milestone's design rests on.
  #
  # One platform and one Python, because what is under test is the toolkit's
  # behaviour rather than the runner's. 3.11 rather than 3.14: the extra's
  # floor is `rdkit>=2024.3.1`, and the series that satisfy it do not all
  # publish wheels for the newest interpreter.
  chem:
    name: chem (RDKit extra)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pip install -e ".[dev,chem]"
        run: pip install -e ".[dev,chem]"
      - name: mypy --strict
        # Run here too: with RDKit installed, mypy sees its sources and
        # checks the calls into it, which the matrix job cannot.
        run: mypy
      - name: pytest (the chemistry tests must run, not skip)
        # The `store` job's step of the same name states that intent; this
        # one can also check it, and does. The difference is not a reproach
        # to that job: `test_store_cli.py` skips legitimately when no bucket
        # is configured, so a guard there would fail an honest run. Nothing
        # here skips once RDKit is installed, so a skip means the install
        # did not take -- and a silent skip would look exactly like a pass,
        # which would put us back to the standardiser being tested on one
        # machine in the world.
        run: |
          pytest -q \
            tests/test_chem.py \
            tests/test_inchikey_stability.py \
            tests/test_molecules.py \
            tests/test_default_install.py | tee chem.txt
          if grep -qE '[0-9]+ skipped' chem.txt; then
            echo "::error::a chemistry test skipped in the job that installs RDKit"
            exit 1
          fi

  # The HIV-1 reference demo, with the real tools over the real reads.
  #
  # CLAUDE.md makes this pipeline the project's validation spine -- "every
  # feature must work end to end on this pipeline" -- so it has to be CI's
  # business and not only the author's. Before this job existed the five
  # acceptance tests in tests/test_demo.py skipped on every run, for want of
  # an aligner and of the gitignored data/, and a regression in the pipeline
  # would have reached main green.
  #
  # Linux only: the demo's worth is that the real pipeline runs at all, not
  # that it runs on two operating systems, and an aligner on the macOS
  # runner costs minutes to buy little.
  demo:
    name: demo (HIV-1 pipeline, real tools)
    runs-on: ubuntu-24.04
    defaults:
      run:
        # A login shell, so the micromamba environment activated below --
        # the one holding minimap2, samtools and bcftools -- is still on
        # PATH in later steps. Without this the tools vanish between steps
        # and the demo goes straight back to skipping.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Versions are pinned in .github/demo-tools.yml, which says why these
      # come from bioconda rather than from apt.
      - name: install minimap2, samtools, bcftools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/demo-tools.yml
          cache-environment: true

      - name: pip install -e .
        run: pip install -e ".[dev]"

      # Keyed on the *digests*, which is what M10 bought: the pins live in
      # the demo pipeline, so editing one re-fetches that input and editing
      # anything else does not. What is cached is the engine's own
      # content-addressed store, where an object's name is the hash of its
      # bytes -- so a restored cache cannot be stale, only incomplete, and
      # an incomplete one is a fetch rather than a wrong answer.
      #
      # `.ligase/cache.sqlite` rides along because it holds the record of
      # which locator produced which object. Losing it costs one re-fetch
      # and nothing else: everything in it is derived from content hashes.
      - name: cache the demo's fetched inputs
        uses: actions/cache@v4
        with:
          path: .ligase
          key: >-
            ligase-store-${{ hashFiles('examples/hiv-resistance/pipeline.py') }}

      # Both projects. PRJNA517147 is what tests/test_demo.py runs the
      # pipeline on, about 103 MB. PRJNA1218827 is M6's validation set, a
      # further 27 MB: its samples have published Stanford HIVdb calls, so
      # tests/test_validation.py can check this pipeline's resistance calls
      # against someone else's answers rather than against itself.
      #
      # On a cache hit this verifies every input against its pin from the
      # store and downloads nothing -- not even HXB2, the one input that
      # comes from a rate-limited API rather than from ENA.
      - name: warm the store
        run: python scripts/fetch_demo_data.py

      # One BAM whose header a real aligner wrote, for the type tests that
      # check what minimap2 actually emits rather than what the SAM
      # specification says. Derived, so deliberately not cached: it costs
      # one run's alignment.
      - name: build the demo alignment
        run: scripts/make_demo_alignment.sh

      # The whole suite rather than tests/test_demo.py alone: with the data
      # and the tools in place, the tests in test_types.py and
      # test_pipeline.py that want real HXB2 and a real BAM stop skipping
      # too.
      #
      # LIGASE_DEMO_REQUIRED turns each of those skips into a failure. This
      # job exists because `sssss` read as success, so a green run here has
      # to mean the pipeline ran -- not that it was politely declined.
      - name: pytest (the demo must run, not skip)
        run: pytest
        env:
          LIGASE_DEMO_REQUIRED: "1"

  # The remote store tier (M14, D43), against a real S3 server.
  #
  # The only job that compiles the `remote-store` feature, and the only one
  # that needs cmake: `object_store`'s AWS stack pulls `aws-lc-sys`, whose
  # build script shells out to it. That is the cost of the feature, it is
  # confined to here and to anyone who asks for it, and
  # `crates/ligase-core/tests/default_build.rs` keeps it out of a default
  # build. Expect eight to twelve minutes cold and four to six with the
  # cargo cache warm, plus about a minute for the S3 server's image.
  #
  # Every setting the server needs is a *provider* variable --
  # AWS_ACCESS_KEY_ID, AWS_ENDPOINT_URL and the rest. Ligase is configured
  # by one name, LIGASE_STORE, and reads no credential of its own (D43).
  #
  # ## Not MinIO, and not by choice
  #
  # M14's done-when names "a MinIO container". MinIO is no longer freely
  # obtainable: `docker.io/minio/minio` denies anonymous pulls,
  # `quay.io/minio/minio` answers 401, and the community binaries at
  # dl.min.io are 410 Gone. Checked all three on 23 October 2026.
  #
  # So this runs LocalStack's S3 instead. Nothing in `tests/s3.rs` is
  # MinIO-specific -- they name only the protocol -- and the point of the
  # job is that the backend talks to something that really speaks S3
  # rather than to a filesystem. LocalStack's community image carries a
  # notice about unifying its images, so if this stops resolving, any
  # S3-speaking server will do: set the endpoint and the bucket and
  # nothing else changes.
  #
  # ## What is run here, and what is not
  #
  # M14's done-when asks for the full suite to pass against this container
  # with LIGASE_STORE set and no test changed. It does not, and the reason
  # is a finding rather than a defect: a few tests assert that a *fresh
  # cache directory* means nothing has been computed, and a shared store is
  # precisely what makes that false. Worse, the set is not fixed -- two
  # tests that compute the same thing from the same inputs have the same
  # step key, and which of them sees the hit depends on which runs first,
  # so excluding one moves the failure to another. Measured: six failures,
  # and seven different ones once those six were skipped.
  #
  # The clause's real question -- is the remote tier substitutable for the
  # local one -- is answered instead by `tests/s3.rs` and the end-to-end
  # tests in `tests/test_store_cli.py`, which run against this bucket and
  # cover the round trip, a 404, an object corrupted in place, the
  # multipart path, eight machines writing one object, and a second machine
  # completing a pipeline with nothing of its own. Each works under its own
  # prefix, because two tests sharing a content-addressed namespace are two
  # tests sharing their answers.
  #
  # `web/content/project/architecture/store.mdx` has the whole argument.
  store:
    name: store (S3, remote-store feature)
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ligaseci
      AWS_SECRET_ACCESS_KEY: ligaseci-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      # `object_store` refuses a plaintext endpoint without this, which is
      # the right default everywhere except a container on localhost.
      AWS_ALLOW_HTTP: "true"
      # Read by the tests that need a real bucket. They skip without it
      # rather than falling back to a directory: a test that silently
      # checks something else is worse than one that says it did not run.
      LIGASE_TEST_STORE: s3://ligase-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Started by hand rather than as a `services:` container so that the
      # readiness check can be the service's own health endpoint rather
      # than a port being open: S3 answering is what the next step needs,
      # and a listening socket is not that.
      - name: start an S3 server
        run: |
          docker run -d --name s3 -p 4566:4566 -e SERVICES=s3 \
            localstack/localstack:4
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4566/_localstack/health 2>/dev/null \
               | grep -q '"s3"'; then
              echo "s3 is up"; exit 0
            fi
            sleep 3
          done
          echo "the S3 server did not come up"; docker logs s3; exit 1

      - name: create the bucket
        run: aws --endpoint-url "$AWS_ENDPOINT_URL" s3 mb s3://ligase-ci

      # With the feature on as well as off. Feature-gated code is the
      # easiest kind to let rot, because the ordinary job never sees it.
      - name: cargo clippy (remote-store)
        run: cargo clippy -p ligase --all-targets --features remote-store -- -D warnings

      - name: cargo test (remote-store, against S3)
        run: cargo test --workspace --features ligase/remote-store

      # A Python extra cannot enable a cargo feature, so the wheel is built
      # with it here. `ligase store status` is what tells a user which kind
      # of build they have, which is the done-when clause about the default
      # install read from the other side.
      - name: pip install -e . with the feature
        run: pip install -e ".[dev]"
        env:
          MATURIN_PEP517_ARGS: --features remote-store

      - name: ligase store status reports a build that can open a bucket
        env:
          LIGASE_STORE: s3://ligase-ci
        run: |
          ligase store status | tee status.txt
          grep -q "remote-store support   yes" status.txt
          grep -q "s3://ligase-ci" status.txt
          grep -q "reachable              yes" status.txt

      # `tests/test_cluster.py` sets its own `file://` store per test, so it
      # passes in the ordinary job too. It is here as well because this is
      # the job with a bucket: a worker run whose store is S3 exercises the
      # lease over HTTP rather than over a rename, which is the only place
      # that difference shows up from Python.
      - name: pytest (the store tests must run, not skip)
        run: |
          pytest -q tests/test_store_cli.py tests/test_queries.py \
                    tests/test_methods.py tests/test_cluster.py

  # There is no `docs` job here. The site is built, link-checked and deployed
  # by `web.yml`, on the same triggers, by a job that installs what its
  # generators need. A copy here was a second, under-provisioned build of the
  # same thing.

  shell:
    name: shell (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh
