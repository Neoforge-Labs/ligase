name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The Ubuntu runner is pinned rather than tracking ubuntu-latest, which
# migrates to Ubuntu 26 from 19 October 2026. A runner image change can
# alter preinstalled tooling -- shellcheck, for one, which the shell job
# relies on being present -- so the image moves when we choose, not on
# GitHub's schedule.
jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        # -D warnings also promotes the workspace `missing_docs` lint to an
        # error, so public items without docs fail CI.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pip install -e .
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: pytest
        run: pytest
      - name: import ligase
        run: python -c "import ligase; print(ligase.__version__)"

  docs:
    name: docs (mkdocs build --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Installed directly rather than via the project's `docs` extra: building
      # the docs does not need the compiled extension, so this job needs no
      # Rust toolchain. Keep these versions in step with pyproject.toml.
      - name: install mkdocs
        run: pip install "mkdocs>=1.6,<2.0" "mkdocs-material>=9.5,<10"
      - name: mkdocs build
        run: mkdocs build --strict

  shell:
    name: shell (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh
