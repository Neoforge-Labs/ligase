name: Release

# Publishing is never automatic. The default for a manual run is a rehearsal
# that uploads nothing anywhere; `testpypi` and `publish` have to be chosen.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: dry-run
        options:
          - dry-run      # build everything, publish nothing
          - testpypi     # wheels to TestPyPI, crate dry-run only
          - publish      # wheels to PyPI and the crate to crates.io
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3-py311 means one wheel per platform rather than one per Python
          # version, so this matrix is five builds instead of twenty.
          - { os: ubuntu-24.04,  target: x86_64,  manylinux: auto }
          - { os: ubuntu-24.04,  target: aarch64, manylinux: auto }
          - { os: macos-latest,  target: aarch64, manylinux: "off" }
          - { os: macos-latest,  target: x86_64,  manylinux: "off" }
          - { os: windows-latest, target: x64,    manylinux: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # rusqlite is built with `bundled`, so every target compiles SQLite
          # from C source and needs a working C toolchain in the image.
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # A wheel that needs a compiler at install time defeats its own purpose, so
  # prove it does not: install into an environment with no Rust on PATH.
  verify-wheel:
    name: verify the Linux wheel needs no toolchain
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-24.04-x86_64
          path: dist
      - name: install from the wheel alone, with cargo removed from PATH
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/cargo /usr/local/bin/rustc || true
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v cargo | grep -v rustup | paste -sd:)"
          ! command -v cargo || { echo "cargo still on PATH; test is meaningless"; exit 1; }
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --no-index --find-links dist ligase-bio
          cd /tmp
          /tmp/clean/bin/python -c "import ligase, sys; assert ligase.__version__, 'no version'; assert hasattr(ligase, 'hivdb'); print('ok', ligase.__version__)"
          /tmp/clean/bin/ligase --help > /dev/null

  pypi:
    name: ${{ github.event.inputs.mode == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: [wheels, sdist, verify-wheel]
    if: github.event_name == 'push' || github.event.inputs.mode != 'dry-run'
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.mode == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token is stored anywhere in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ github.event.inputs.mode == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          # PyPI refuses a file it already has, and refuses it again even if the
          # version was deleted. Without this, re-running a release fails on the
          # upload rather than reporting there was nothing new to do.
          skip-existing: true

  crate:
    name: crates.io
    needs: [wheels, sdist, verify-wheel]
    runs-on: ubuntu-24.04
    # Declared unconditionally: an empty environment name is not valid, and
    # naming it always means required reviewers can gate an irreversible
    # publish. The token is read from here or from a repository secret.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rehearse
        run: cargo publish --dry-run -p ligase

      # crates.io will not accept a version twice, and the crate may have been
      # published by hand. Ask the registry first so a re-run or a retag skips
      # cleanly instead of failing on `already exists`.
      - name: is this version already on crates.io?
        id: probe
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ligase") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The sparse index is the registry's own source of truth and needs no
          # auth. Anything other than a confirmed "present" falls through to the
          # publish below, so a failed probe fails loudly rather than silently
          # skipping a release.
          present="$(curl -sS --max-time 30 -H 'User-Agent: ligase-release' \
              https://index.crates.io/li/ga/ligase \
            | jq -s --arg v "$version" 'any(.[]; .vers == $v)' 2>/dev/null || echo unknown)"
          if [ "$present" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ligase $version is already on crates.io."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ligase $version is not on crates.io (probe said: $present)."
          fi

      - name: publish
        if: >-
          (github.event_name == 'push' || github.event.inputs.mode == 'publish')
          && steps.probe.outputs.present != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ligase

      - name: already published
        if: >-
          (github.event_name == 'push' || github.event.inputs.mode == 'publish')
          && steps.probe.outputs.present == 'true'
        run: >-
          echo "::notice::ligase ${{ steps.probe.outputs.version }} is already on
          crates.io, so this job published nothing. Bump the workspace version to
          release a new one."
