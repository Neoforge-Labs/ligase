name: Release

# Publishing is never automatic. The default for a manual run is a rehearsal
# that uploads nothing anywhere; `testpypi` and `publish` have to be chosen.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: dry-run
        options:
          - dry-run      # build everything, publish nothing
          - testpypi     # wheels to TestPyPI, crate dry-run only
          - publish      # wheels to PyPI and the crate to crates.io
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is a claim about the version, and nothing checked it: v0.2.0 was
  # tagged on a tree that still called itself 0.1.0. Everything downstream is
  # built to be re-runnable, which is the same thing as being quiet -- PyPI
  # skips a file it already has, the crates.io probe skips a version the index
  # already lists -- so that release would have gone green having published
  # nothing at all.
  version:
    name: the tag and the changelog agree with the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: the version is what this release says it is
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ligase") | .version')"
          echo "the workspace says $version"

          # On a tag push the tag is the release's name, so it has to be the
          # version; otherwise the artefacts are named after something else.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} names ${tagged}, but the workspace version is ${version}. Bump the version, or move the tag."
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} agrees"
          fi

          # And the number must have something written under it. A dated
          # section means the `[Unreleased]` entries were moved; an unrolled
          # changelog means they were not.
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for ${version}. Move the [Unreleased] entries into one."
            exit 1
          fi
          echo "CHANGELOG.md has a dated section for ${version}"

          # And a change that alters results is named where a consumer
          # choosing a pin will see it (D57). A changelog body is not a
          # release signal: a consumer pinned `>=0.1.0` picks a minor bump
          # up on their next lock, and two integrations lost a debugging
          # cycle to migrations documented only inside a long entry. So an
          # entry that points at MIGRATING.md must have a section there.
          #
          # `tests/test_import.py` asserts the same pair, so this normally
          # fails in `pytest` long before a tag. It is here as well because
          # this job is the last thing between a tag and two append-only
          # registries, and a release is the one moment the pair matters.
          entries="$(awk "/^## \\[${version}\\] - /{found=1; next} /^## /{if (found) exit} found" CHANGELOG.md)"
          if printf '%s' "$entries" | grep -q 'MIGRATING.md'; then
            if ! grep -qE "^## .*${version}" MIGRATING.md; then
              echo "::error::CHANGELOG.md's ${version} section points at MIGRATING.md, which has no section for ${version}. Write what breaks and the edit that fixes it."
              exit 1
            fi
            echo "MIGRATING.md has a section for ${version}"
          fi

  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3-py311 means one wheel per platform rather than one per Python
          # version, so this matrix is five builds instead of twenty.
          #
          # x86_64 stays on `auto`, which is manylinux2014 and glibc 2.17, so
          # the wheel still installs on the elderly cluster login nodes a lot
          # of this audience is given.
          - { os: ubuntu-24.04,  target: x86_64,  manylinux: auto }
          # aarch64 cannot: `auto` is CentOS 7's cross toolchain, GCC 4.8.5,
          # which defines `__aarch64__` and not `__ARM_ARCH`, and that exact
          # pair is what `ring`'s `asm_base.h` raises
          # `#error "ARM assembler must define __ARM_ARCH"` on. It took the
          # whole of v0.2.0's release down with it, because `verify-wheel`,
          # PyPI and crates.io all `needs:` the wheels. `ring` arrived in v0.2
          # behind `ureq`'s rustls, which is why the same workflow released
          # v0.1.0. The 2_28 image's GCC 7.5.0 defines `__ARM_ARCH 8`, at the
          # cost of a glibc 2.28 floor on this wheel alone -- no older distro
          # ran aarch64 in anger.
          - { os: ubuntu-24.04,  target: aarch64, manylinux: "2_28" }
          - { os: macos-latest,  target: aarch64, manylinux: "off" }
          - { os: macos-latest,  target: x86_64,  manylinux: "off" }
          - { os: windows-latest, target: x64,    manylinux: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # rusqlite is built with `bundled`, so every target compiles SQLite
          # from C source and needs a working C toolchain in the image.
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # A wheel that needs a compiler at install time defeats its own purpose, so
  # prove it does not: install into an environment with no Rust on PATH.
  verify-wheel:
    name: verify the Linux wheel needs no toolchain
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-24.04-x86_64
          path: dist
      - name: install from the wheel alone, with cargo removed from PATH
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/cargo /usr/local/bin/rustc || true
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v cargo | grep -v rustup | paste -sd:)"
          ! command -v cargo || { echo "cargo still on PATH; test is meaningless"; exit 1; }
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --no-index --find-links dist ligase-bio
          cd /tmp
          /tmp/clean/bin/python -c "import ligase, sys; assert ligase.__version__, 'no version'; assert hasattr(ligase, 'hivdb'); print('ok', ligase.__version__)"
          /tmp/clean/bin/ligase --help > /dev/null

  pypi:
    name: ${{ github.event.inputs.mode == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: [version, wheels, sdist, verify-wheel]
    if: github.event_name == 'push' || github.event.inputs.mode != 'dry-run'
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.mode == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token is stored anywhere in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ github.event.inputs.mode == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          # PyPI refuses a file it already has, and refuses it again even if the
          # version was deleted. Without this, re-running a release fails on the
          # upload rather than reporting there was nothing new to do.
          skip-existing: true

  crate:
    name: crates.io
    needs: [version, wheels, sdist, verify-wheel]
    runs-on: ubuntu-24.04
    # Declared unconditionally: an empty environment name is not valid, and
    # naming it always means required reviewers can gate an irreversible
    # publish. The token is read from here or from a repository secret.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rehearse
        run: cargo publish --dry-run -p ligase

      # crates.io will not accept a version twice, and the crate may have been
      # published by hand. Ask the registry first so a re-run or a retag skips
      # cleanly instead of failing on `already exists`.
      - name: is this version already on crates.io?
        id: probe
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ligase") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The sparse index is the registry's own source of truth and needs no
          # auth. Anything other than a confirmed "present" falls through to the
          # publish below, so a failed probe fails loudly rather than silently
          # skipping a release.
          present="$(curl -sS --max-time 30 -H 'User-Agent: ligase-release' \
              https://index.crates.io/li/ga/ligase \
            | jq -s --arg v "$version" 'any(.[]; .vers == $v)' 2>/dev/null || echo unknown)"
          if [ "$present" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ligase $version is already on crates.io."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ligase $version is not on crates.io (probe said: $present)."
          fi

      - name: publish
        if: >-
          (github.event_name == 'push' || github.event.inputs.mode == 'publish')
          && steps.probe.outputs.present != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ligase

      - name: already published
        if: >-
          (github.event_name == 'push' || github.event.inputs.mode == 'publish')
          && steps.probe.outputs.present == 'true'
        run: >-
          echo "::notice::ligase ${{ steps.probe.outputs.version }} is already on
          crates.io, so this job published nothing. Bump the workspace version to
          release a new one."
